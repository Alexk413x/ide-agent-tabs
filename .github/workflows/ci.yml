name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  jetbrains:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetbrains
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            jetbrains/*.gradle.kts
            jetbrains/gradle.properties
            jetbrains/gradle/wrapper/gradle-wrapper.properties
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: ./gradlew test buildPlugin --console=plain

  # hashFiles() isn't available in a job-level `if`, so this job reports whether the VS Code part exists.
  parts:
    runs-on: ubuntu-latest
    outputs:
      vscode: ${{ steps.find.outputs.vscode }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: echo "vscode=${{ hashFiles('vscode/package.json') != '' }}" >> "$GITHUB_OUTPUT"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/check-no-node.mjs
      - run: node scripts/check-plugin-version.mjs
      - run: node --test scripts/test/bump.test.mjs
      - shell: bash
        run: |
          jetbrains_version=$(sed -n 's/^pluginVersion=//p' jetbrains/gradle.properties)
          vscode_version=$(node -p "require('./vscode/package.json').version")
          bundled_jetbrains=$(node -p "require('./claude-plugin/dist/ide/versions.json').jetbrains")
          bundled_vscode=$(node -p "require('./claude-plugin/dist/ide/versions.json').vscode")
          if [ "$bundled_jetbrains" != "$jetbrains_version" ] || [ "$bundled_vscode" != "$vscode_version" ]; then
            echo "::error::claude-plugin/dist/ide/versions.json (jetbrains $bundled_jetbrains, vscode $bundled_vscode) doesn't match jetbrains/gradle.properties ($jetbrains_version) and vscode/package.json ($vscode_version). Run 'node scripts/pack-ides.mjs' and commit the result."
            exit 1
          fi

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} --no-project python -I -S mcp/tests/run.py
      - if: matrix.os == 'macos-latest' && matrix.python == '3.9'
        shell: bash
        run: |
          if [ -x /usr/bin/python3 ]; then
            /usr/bin/python3 -c 'import sqlite3, sys; print(sys.version, "SQLite", sqlite3.sqlite_version)'
            /usr/bin/python3 -I -S mcp/tests/run.py
          fi

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff@0.16.10 check
      - run: uvx ruff@0.16.10 format --check
      - run: uv run --frozen pyright
      - run: uv run --frozen pyright --pythonplatform Linux

  # Runs the Python store, hooks and shared server against the frozen 0.8.0 Node build in mcp/tests/node080/,
  # which keeps serving sessions that started before an update to 0.9.0.
  interop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      IDE_AGENT_TABS_INTEROP: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} --no-project python -I -S mcp/tests/run.py -v test_lock_interop test_store_interop test_stress_mixed test_hook_interop test_shared_process.NodeHandoverTest test_server_cli.AgainstNodeServer

  vscode:
    needs: parts
    if: needs.parts.outputs.vscode == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
