name: Release

on:
  push:
    tags:
      - 'jetbrains-v*'
      - 'vscode-v*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      part: ${{ steps.check.outputs.part }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          part="${TAG%%-v*}"
          version="${TAG#"$part"-v}"
          case "$part" in
            jetbrains) actual=$(sed -n 's/^pluginVersion=//p' jetbrains/gradle.properties) ;;
            vscode) actual=$(node -p "require('./vscode/package.json').version") ;;
            *) echo "::error::Unknown part in tag $TAG"; exit 1 ;;
          esac
          if [ "$version" != "$actual" ]; then
            echo "::error::Tag $TAG has version $version, but $part is at version $actual."
            exit 1
          fi
          echo "part=$part" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  jetbrains:
    needs: version
    if: needs.version.outputs.part == 'jetbrains'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetbrains
    steps:
      # The Plugin Verifier unpacks IntelliJ IDEA and Android Studio, which overflows the runner's default free disk.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        working-directory: /
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            jetbrains/*.gradle.kts
            jetbrains/gradle.properties
            jetbrains/gradle/wrapper/gradle-wrapper.properties
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: ./gradlew test buildPlugin verifyPlugin --console=plain
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp "build/distributions/ide-agent-tabs-$VERSION.zip" "$RUNNER_TEMP/release/"
          cd "$RUNNER_TEMP/release" && sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  jetbrains-windows:
    needs: version
    if: needs.version.outputs.part == 'jetbrains'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: jetbrains
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            jetbrains/*.gradle.kts
            jetbrains/gradle.properties
            jetbrains/gradle/wrapper/gradle-wrapper.properties
      - run: .\gradlew.bat test --console=plain

  vscode:
    needs: version
    if: needs.version.outputs.part == 'vscode'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npx --yes @vscode/vsce package --no-dependencies --out "$RUNNER_TEMP/release/ide-agent-tabs-$VERSION.vsix"
      - run: cd "$RUNNER_TEMP/release" && sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    needs: [version, jetbrains, jetbrains-windows, vscode]
    if: >-
      always() && needs.version.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "$TAG" --generate-notes --verify-tag
          fi
