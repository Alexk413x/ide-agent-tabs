name: Release branch

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Tag the plugin version
        id: version
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' claude-plugin/.claude-plugin/plugin.json | head -n 1)
          test -n "$version"
          tag="ide-agent-tabs--v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "ide-agent-tabs $version" "$TESTED_SHA"
            git push origin "refs/tags/$tag"
          fi
          git fetch -q --depth=1 origin release:refs/remotes/origin/release || true
          released=$(git show origin/release:.claude-plugin/plugin.json 2>/dev/null | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -n 1)
          if [ "$released" = "$version" ]; then
            echo "The release branch holds $version, so main holds changes that are not released. Bump the version to release them."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the release branch from the plugin folder
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sh scripts/release-tree.sh
          git checkout -B release
          git add -A
          git commit -q -m "Release build of ${TESTED_SHA::7}"
          git push -f origin release
