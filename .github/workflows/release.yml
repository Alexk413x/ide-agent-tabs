name: Release branch

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag the plugin version
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' claude-plugin/.claude-plugin/plugin.json | head -n 1)
          test -n "$version"
          tag="ide-agent-tabs--v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "ide-agent-tabs $version" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
      - name: Build the release branch from the plugin folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sh scripts/release-tree.sh
          git checkout -B release
          git add -A
          git commit -q -m "Release build of ${GITHUB_SHA::7}"
          git push -f origin release
